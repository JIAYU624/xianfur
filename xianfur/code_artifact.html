<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>冼夫人足迹地图 - 唯用一好心</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Noto Serif SC for classic feel -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'ancient-paper': '#f6f4ee', // 提亮一点的米白，显得更干净
                        'lingnan-cyan': '#235051',  // 更深邃的岭南青
                        'antique-gold': '#c0923e',  // 更温润的古铜金
                        'history-red': '#942f2f',   // 略带朱砂质感的历史红
                        'dark-ink': '#262626',      // 墨黑
                    },
                    fontFamily: {
                        'serif': ['"Noto Serif SC"', 'serif'],
                        'calligraphy': ['"Zhi Mang Xing"', 'cursive'],
                        'sans': ['Inter', 'sans-serif'],
                    },
                    boxShadow: {
                        'ancient': '0 10px 30px -5px rgba(38, 38, 38, 0.2), 0 0 10px rgba(192, 146, 62, 0.1)',
                        'marker': '0 4px 10px rgba(0,0,0,0.4), inset 0 2px 4px rgba(255,255,255,0.3)',
                    }
                }
            }
        }
    </script>
    
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #1a1a1a; font-family: 'Noto Serif SC', serif; }
        
        #map { width: 100vw; height: 100vh; z-index: 10; background: #e6e0d4; }
        
        /* 优化古风滤镜：稍微调暖，降低对比度，更像陈年古卷 */
        .leaflet-tile-pane {
            filter: grayscale(0.4) sepia(0.55) contrast(1.05) brightness(0.95) hue-rotate(-5deg);
        }

        /* 全局暗角效果：让视觉中心聚焦于地图中央，增加历史厚重感 */
        .vignette-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            box-shadow: inset 0 0 150px rgba(0,0,0,0.4);
            z-index: 20;
        }

        /* 升级版 Marker：打造“玉石/印章”的立体质感 */
        .custom-marker {
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            border: 2px solid rgba(246, 244, 238, 0.9);
            box-shadow: 0 4px 8px rgba(0,0,0,0.4), inset 0 2px 5px rgba(255,255,255,0.4);
            background-image: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, rgba(0,0,0,0.1) 100%);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .custom-marker:hover { transform: scale(1.25) translateY(-5px); z-index: 1000 !important; box-shadow: 0 8px 15px rgba(0,0,0,0.5), inset 0 2px 5px rgba(255,255,255,0.5); }
        
        .marker-history { background-color: #942f2f; }
        .marker-relic { background-color: #c0923e; }
        .marker-spirit { background-color: #235051; }

        /* 优化脉冲动画：更柔和的光晕 */
        .pulse::after {
            content: "";
            border-radius: 50%;
            height: 100%; width: 100%;
            position: absolute;
            animation: pulsate 2.5s ease-out infinite;
            opacity: 0.0;
        }
        .marker-history.pulse::after { box-shadow: 0 0 0 12px rgba(148, 47, 47, 0.6); }
        .marker-relic.pulse::after { box-shadow: 0 0 0 12px rgba(192, 146, 62, 0.6); }

        @keyframes pulsate {
            0% { transform: scale(0.6); opacity: 0.8; }
            100% { transform: scale(1.8); opacity: 0; }
        }

        /* 隐藏Leaflet默认控件，自定义zoom位置 */
        .leaflet-control-attribution { display: none; }
        .leaflet-control-zoom { 
            border: 1px solid rgba(192, 146, 62, 0.3) !important; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.15) !important; 
            margin-top: 100px !important; 
            margin-left: 20px !important;
            border-radius: 8px !important;
            overflow: hidden;
        }
        .leaflet-bar a { 
            background-color: rgba(246, 244, 238, 0.9) !important; 
            color: #235051 !important; 
            backdrop-filter: blur(4px);
        }
        .leaflet-bar a:hover { background-color: #f6f4ee !important; }

        /* 面板滑动动画 */
        #detail-panel { transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1); }
        .panel-closed { transform: translateY(100%); }
        .panel-open { transform: translateY(0); }
        @media (min-width: 768px) {
            .panel-closed { transform: translateX(-100%); }
            .panel-open { transform: translateX(0); }
        }

        /* 滚动条美化 */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: rgba(192, 146, 62, 0.3); border-radius: 10px; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 文字阴影增强书法感 */
        .text-shadow-calligraphy { text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
    </style>
</head>

                id: 4, type: 'history', stage: 'mature-war', ancientName: '高凉/合浦', name: '广东茂名至广西北海', 
                lat: 21.650, lng: 109.118, title: '平欧阳纥，大义灭亲',
                desc: '陈朝时，广州刺史欧阳纥叛乱，召冼夫人之子冯仆为人质。冼夫人不因私情害公义，毅然发兵拒境，配合陈军平叛。因此功绩被册封为中郎将、石龙太夫人。',
                significance: '坚持“唯用一好心”，不随波逐流，不顾私情，再次维护了岭南的安定与南朝版图的统一。', icon: 'fa-shield-halved', isCore: false, order: 4
            },

            // --- 第四阶段：归隋安民 ---
            {
                id: 5, type: 'history', stage: 'mature-sui', ancientName: '番禺', name: '广东广州南沙', 
                lat: 22.850, lng: 113.550, title: '奉诏归隋，天下一统',
                desc: '陈朝灭亡后，岭南数郡共奉冼夫人为主，号“圣母”。隋文帝派使者展示陈后主信物，冼夫人见物痛哭，随后降下陈旗，率领岭南百越归顺隋朝。',
                significance: '让岭南兵不血刃并入大隋版图，避免了生灵涂炭，直接促成了中国历史上南北朝之后的大一统。', icon: 'fa-scroll', isCore: true, order: 5
            },

            // --- 第五阶段：晚年巡抚 ---
            {
                id: 6, type: 'history', stage: 'later', ancientName: '崖州/儋耳', name: '海南儋州等全境', 
                lat: 19.522, lng: 109.580, title: '请置崖州，安抚海南',
                desc: '冼夫人上书朝廷在海南岛重新设置崖州，恢复了中原王朝对海南岛的直接管辖。晚年她亲自巡视海南各部落，惩治贪官，教化民众，推广中原先进技术。',
                significance: '确立了中央政权对海南的实质性管辖，促进了海南岛的开发与文明开化，功在千秋。', icon: 'fa-ship', isCore: true, order: 6
            },

            // --- 文化遗存 (贯穿全图) ---
            {
                id: 7, type: 'relic', stage: 'all', ancientName: '高凉郡遗址', name: '茂名高州市区', 
                lat: 21.930, lng: 110.850, title: '高州冼太庙',
                desc: '岭南地区规模最大、等级最高的冼太庙之一。始建于明代，保留了丰富的木雕、石雕及壁画艺术，是历代官方与民间祭祀冼夫人的核心场所。',
                significance: '全国重点文物保护单位，传承冼夫人信仰的核心建筑载体与历史见证。', icon: 'fa-vihara', isCore: true
            },
            {
                id: 8, type: 'relic', stage: 'all', ancientName: '丁村古村', name: '茂名电白区', 
                lat: 21.550, lng: 111.050, title: '冼太夫人故里文化旅游区',
                desc: '包含隋谯国夫人冼氏墓（全国重点文物保护单位）、冼太庙等古迹，出土了大量隋唐时期的珍贵文物，如具有波斯风格的铜器等，印证了当时海上丝绸之路的繁荣。',
                significance: '历史学与考古学研究的实物宝库，也是现代文旅打卡、寻根问祖的核心景区。', icon: 'fa-archway', isCore: true
            },
            {
                id: 9, type: 'relic', stage: 'all', ancientName: '崖州', name: '海口市琼山区', 
                lat: 19.980, lng: 110.350, title: '海南冼夫人纪念馆',
                desc: '专门展示了冼夫人收复、治理海南的历史功绩，馆内保存有历代缅怀冼夫人的碑刻和祭祀用品。',
                significance: '海南人民世世代代感念与祭拜“圣母”的重要精神场所。', icon: 'fa-monument', isCore: false
            },

            // --- 精神传承 (现代/海外) ---
            {
                id: 10, type: 'spirit', stage: 'all', ancientName: '-', name: '茂名/海南各地', 
                lat: 21.600, lng: 110.900, title: '冼夫人信俗（非遗）',
                desc: '每年农历十一月廿四冼夫人诞辰及春节期间，各地举行盛大的祭祀、巡游（如茂名“年例”）、游神活动，包含舞狮、木偶戏、抢花炮等丰富的民间艺术。',
                significance: '作为国家级非物质文化遗产，活态传承了“好心精神”，极大地增强了海内外华人的文化认同感与凝聚力。', icon: 'fa-fire-flame-curved', isCore: true
            },
            {
                id: 11, type: 'spirit', stage: 'all', ancientName: '海上丝绸之路', name: '东南亚及海外', 
                lat: 18.000, lng: 112.000, title: '好心文化出海',
                desc: '随着下南洋的华侨脚步，冼太庙被建到了马来西亚、新加坡、越南等地。冼夫人从一位历史人物，逐渐化身为海上丝绸之路上的重要民间保护神。',
                significance: '成为岭南文化对外传播的桥梁，紧密连接海外侨胞的精神纽带。', icon: 'fa-earth-asia', isCore: false
            }
        ];

        let map;
        let markersGroup;
        let currentPolyline = null;
        let currentStageState = 'all';

        function initMap() {
            // 设定初始中心点在岭南区域
            map = L.map('map', {
                center: [21.0, 111.5],
                zoom: 7,
                zoomControl: false,
                maxBounds: [[15.0, 104.0], [26.0, 118.0]], // 限制拖动范围在华南
                maxBoundsViscosity: 0.8
            });

            L.control.zoom({ position: 'topleft' }).addTo(map);

            // 使用高德底图，配合CSS达到古风效果
            L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
                subdomains: ['1', '2', '3', '4'],
                attribution: '&copy; 高德地图',
                maxZoom: 11,
                minZoom: 6
            }).addTo(map);

            markersGroup = L.layerGroup().addTo(map);

            setTimeout(() => {
                map.invalidateSize();
                updateMap();
            }, 100);
        }

        function updateMap() {
            markersGroup.clearLayers();
            if (currentPolyline) {
                map.removeLayer(currentPolyline);
            }

            const showHistory = document.getElementById('filter-history').checked;
            const showRelic = document.getElementById('filter-relic').checked;
            const showSpirit = document.getElementById('filter-spirit').checked;

            footprintData.forEach(point => {
                if (point.type === 'history' && !showHistory) return;
                if (point.type === 'relic' && !showRelic) return;
                if (point.type === 'spirit' && !showSpirit) return;

                if (currentStageState !== 'all' && point.type === 'history') {
                    if (point.stage !== currentStageState) return;
                }

                let markerClass = '';
                let size = point.isCore ? [44, 44] : [32, 32];
                let iconSize = point.isCore ? 'text-xl' : 'text-sm';
                
                if (point.type === 'history') markerClass = 'marker-history text-white';
                if (point.type === 'relic') markerClass = 'marker-relic text-white';
                if (point.type === 'spirit') markerClass = 'marker-spirit text-white';

                if (point.isCore) markerClass += ' pulse';

                const customIcon = L.divIcon({
                    className: `custom-marker ${markerClass}`,
                    html: `<i class="fas ${point.icon} ${iconSize}"></i>`,
                    iconSize: size,
                    iconAnchor: [size[0]/2, size[1]/2]
                });

                const marker = L.marker([point.lat, point.lng], { icon: customIcon }).addTo(markersGroup);
                
                marker.on('click', () => {
                    openDetailPanel(point);
                    
                    // 像素级平移避免眩晕
                    const targetZoom = map.getZoom() < 8 ? 8 : map.getZoom(); 
                    const targetPoint = map.project([point.lat, point.lng], targetZoom);
                    
                    if (window.innerWidth >= 768) {
                        targetPoint.x -= 210; // 适配新版420px宽度的面板
                    } else {
                        targetPoint.y += window.innerHeight * 0.4; 
                    }
                    
                    const targetLatLng = map.unproject(targetPoint, targetZoom);

                    if (map.getSize().x > 0) {
                        if (map.getZoom() === targetZoom) {
                            map.panTo(targetLatLng, { animate: true, duration: 0.6, easeLinearity: 0.25 });
                        } else {
                            map.flyTo(targetLatLng, targetZoom, { duration: 0.6, easeLinearity: 0.25 });
                        }
                    } else {
                        map.setView(targetLatLng, targetZoom);
                    }
                });
            });

            // 绘制轨迹线
            if (showHistory) {
                const allTracePoints = footprintData
                    .filter(p => p.type === 'history' && p.order)
                    .sort((a, b) => a.order - b.order);

                if (currentStageState === 'all') {
                    const latlngs = allTracePoints.map(p => [p.lat, p.lng]);
                    currentPolyline = L.polyline(latlngs, {
                        color: '#c0923e', 
                        weight: 2,
                        opacity: 0.4,
                        dashArray: '4, 8',
                        lineJoin: 'round'
                    }).addTo(map);
                    
                    if (map.getSize().x > 0 && map.getSize().y > 0) {
                        map.flyTo([21.0, 111.5], 7, { duration: 1.0 });
                    }
                } else {
                    let stagePoints = allTracePoints.filter(p => p.stage === currentStageState);
                    
                    if (stagePoints.length > 0) {
                        let linePoints = [];
                        let firstPointIndex = allTracePoints.findIndex(p => p.id === stagePoints[0].id);
                        
                        if (firstPointIndex > 0) {
                            linePoints.push(allTracePoints[firstPointIndex - 1]);
                        }
                        linePoints.push(...stagePoints);

                        if (linePoints.length > 1) {
                            const latlngs = linePoints.map(p => [p.lat, p.lng]);
                            currentPolyline = L.polyline(latlngs, {
                                color: '#942f2f',
                                weight: 4,
                                opacity: 0.85,
                                dashArray: '8, 12',
                                lineJoin: 'round'
                            }).addTo(map);
                        }
                        
                        const boundsPoints = stagePoints.map(p => [p.lat, p.lng]);
                        const bounds = L.latLngBounds(boundsPoints);
                        
                        if (map.getSize().x > 0 && map.getSize().y > 0) {
                            // padding增加，适应暗角和UI遮挡
                            map.fitBounds(bounds, { padding: [100, 100], maxZoom: 9, animate: true, duration: 0.8 });
                        }
                    }
                }
            }
        }

        function selectStage(stage) {
            currentStageState = stage;
            
            document.querySelectorAll('.timeline-btn').forEach(btn => {
                const iconDiv = btn.querySelector('div');
                const textSpan = btn.querySelectorAll('span')[0]; // 取第一个span (外层)
                
                if (btn.dataset.stage === stage) {
                    // Active state
                    if(stage === 'all'){
                        iconDiv.className = 'w-12 h-12 rounded-full border-2 border-antique-gold bg-antique-gold text-white flex items-center justify-center transition-all duration-300 shadow-lg scale-110 z-10';
                        textSpan.className = 'text-xs mt-2 font-bold text-antique-gold tracking-widest whitespace-nowrap';
                    } else {
                        iconDiv.className = 'w-12 h-12 rounded-full border-2 border-history-red bg-history-red text-white flex items-center justify-center transition-all duration-300 shadow-lg scale-110 z-10';
                        textSpan.className = 'text-xs mt-2 font-bold text-history-red tracking-widest whitespace-nowrap text-center leading-tight';
                    }
                } else {
                    // Inactive state
                    iconDiv.className = 'w-10 h-10 rounded-full border-2 border-gray-300 group-hover:border-history-red bg-ancient-paper flex items-center justify-center transition-all duration-300 z-10 text-gray-500 group-hover:text-history-red';
                    if(btn.dataset.stage === 'all'){
                        textSpan.className = 'text-xs mt-2 font-bold text-gray-500 tracking-widest whitespace-nowrap';
                    } else {
                        textSpan.className = 'text-xs mt-2 text-gray-500 group-hover:text-history-red font-medium text-center leading-tight';
                    }
                }
            });

            document.getElementById('filter-history').checked = true;
            updateMap();
            closePanel();
        }

        function openDetailPanel(pointData) {
            const panel = document.getElementById('detail-panel');
            
            document.getElementById('panel-title').innerText = pointData.title;
            document.getElementById('panel-ancient-name').innerText = pointData.ancientName;
            document.getElementById('panel-modern-name').innerText = pointData.name;
            document.getElementById('panel-desc').innerText = pointData.desc;
            document.getElementById('panel-significance').innerText = pointData.significance;

            const badge = document.getElementById('panel-badge');
            let typeName, typeColor;
            if (pointData.type === 'history') { typeName = '历史事件'; typeColor = 'bg-history-red'; }
            else if (pointData.type === 'relic') { typeName = '文化遗存'; typeColor = 'bg-antique-gold'; }
            else { typeName = '精神传承'; typeColor = 'bg-lingnan-cyan'; }
            
            badge.innerText = typeName;
            badge.className = `inline-block px-4 py-1 rounded-sm text-xs font-bold text-white ${typeColor} mb-2 tracking-widest shadow-sm`;

            const imgEl = document.getElementById('panel-img');
            imgEl.classList.add('opacity-0'); 
            const imgColor = pointData.type === 'history' ? '942f2f' : (pointData.type === 'relic' ? 'c0923e' : '235051');
            const imgText = encodeURIComponent(pointData.title);
            imgEl.src = `https://placehold.co/800x600/${imgColor}/F6F4EE?text=${imgText}&font=serif`;

            panel.classList.remove('hidden');
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    panel.classList.remove('panel-closed');
                    panel.classList.add('panel-open');
                });
            });
        }

        function closePanel() {
            const panel = document.getElementById('detail-panel');
            if(panel.classList.contains('hidden')) return;

            panel.classList.remove('panel-open');
            panel.classList.add('panel-closed');

            setTimeout(() => {
                panel.classList.add('hidden');
            }, 600); 
        }

        window.onload = function() {
            initMap();
        };
    </script>
</body>
</html>
